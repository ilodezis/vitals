name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: osv-scanner catches new advisories for dependencies that did not change
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      # In-memory SQLite, the suite's default.
      - name: Run backend tests
        run: python -m pytest -q
      # vitest resolves its config from the working directory, so the frontend
      # steps must run inside frontend/ rather than with --prefix from the root.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests and build
        working-directory: frontend
        run: |
          npx vitest run
          npm run build

  osv:
    name: osv-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # requirements*.txt are exact locks; resolving them again only reintroduces drift.
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --no-resolve
            --recursive
            ./
