  interpretation: Аллель A на прямой цепи (кодирующий T, 736Val) в гене матриптазы-2 (TMPRSS6) повышает
    уровень гепсидина, снижая всасывание железа в кишечнике и ассоциирован с более низким ферритином и
    гемоглобином.
  action_notes: Регулярно проверять ферритин, ОАК и сывороточное железо — особенно при интенсивных тренировках
    или низком потреблении красного мяса.
