# Curated SNP catalog for Vitals (GRCh38 forward-strand verified).
#
# Every rsID, chromosome, reference allele, and effect allele is cross-checked
# against NCBI dbSNP (GRCh38), MyVariant.info (hg19 + hg38 + gnomAD + SnpEff),
# and EBI GWAS Catalog / CPIC / PharmGKB.
#
# Schema per rsID:
#   gene:            Official HGNC gene symbol
#   chrom:           GRCh38 chromosome ('1'..'22', 'X')
#   strand:          Gene transcript strand ('+' or '-')
#   ref_grch38:      GRCh38 forward (+) strand reference allele
#   effect_allele:   Forward (+) strand allele associated with the described trait/risk
#   category:        Functional panel slug
#   impact_domain:   Vitals Domain enum value
#   evidence:        Evidence tier ('A' = CPIC/ClinVar/replicated clinical guideline,
#                    'B' = PharmGKB 2A-2B / replicated meta-analyses, 'C' = moderate GWAS)
#   source:          Primary scientific reference
#   impact:          Short summary (<= 128 chars)
#   interpretation:  Detailed physiological & zygosity interpretation
#   action_notes:    Practical navigator guidance (not medical advice)
#   marker:          Optional conflict-engine marker slug
#   marker_on:       'any' (1-2 copies or chrX hemizygous) | 'hom' (2 copies or chrX hemizygous)
#   marker_by_effect_copies: Optional {1: slug, 2: slug} zygosity-specific map

# ── Iron & Minerals (14 SNPs) ─────────────────────────────────────────────────
rs1800562:
  gene: HFE
  chrom: '6'
  strand: +
  ref_grch38: G
  effect_allele: A
  category: iron_minerals
  impact_domain: supplements
  evidence: A
  source: ClinVar (Pathogenic); EASL Hemochromatosis Guidelines 2022
  impact: Накопление железа (гемохроматоз, C282Y)
  interpretation: Вариант C282Y (G>A, p.Cys282Tyr) — главный генетический фактор наследственного гемохроматоза.
    Гомозигота A/A резко повышает риск перегрузки железом (особенно у мужчин), носительство G/A — умеренно,
    но усиливается в сочетании с H63D.
  action_notes: Не принимать препараты железа без подтверждённого дефицита (ферритин + насыщение трансферрина).
    Осторожнее с высокими дозами витамина C вместе с железосодержащей пищей.
  marker: hemochromatosis_carrier
  marker_on: any

rs1799945:
  gene: HFE
  chrom: '6'
  strand: +
  ref_grch38: C
  effect_allele: G
  category: iron_minerals
  impact_domain: supplements
  evidence: A
  source: ClinVar; EASL Hemochromatosis Guidelines 2022
  impact: Накопление железа (гемохроматоз, H63D)
  interpretation: Вариант H63D (C>G, p.His63Asp) слабее влияет на накопление железа, чем C282Y; сам по
    себе редко вызывает тяжёлую перегрузку, но значим в гомозиготе G/G и особенно в составной гетерозиготе
    с C282Y.
  action_notes: Не пить железо профилактически; ориентироваться на ферритин и насыщение трансферрина.
  marker: hemochromatosis_carrier
  marker_on: any

