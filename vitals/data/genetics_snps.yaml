# ── Folate, B-Vitamins & Methylation (15 SNPs) ────────────────────────────────
rs1801133:
  gene: MTHFR
  chrom: '1'
  strand: '-'
  ref_grch38: G
  effect_allele: A
  category: folate_methylation
  impact_domain: supplements
  evidence: A
  source: ClinVar; PharmGKB; Frosst et al. (Nat Genet 1995)
  impact: Метаболизм фолата (MTHFR C677T)
  interpretation: 'Вариант C677T (на прямой цепи GRCh38: G>A, кодирующий C>T, p.Ala222Val). Аллель A (677T)
    снижает активность фермента MTHFR (~65% у гетерозигот, ~30% у гомозигот), ухудшая превращение фолиевой
    кислоты в 5-MTHF и повышая склонность к росту гомоцистеина при дефиците фолата/B2.'
  action_notes: При аллеле A (677T) предпочтителен L-метилфолат (5-MTHF) вместо синтетической фолиевой
    кислоты; полезно проверить гомоцистеин, B12 и поддерживать рибофлавин (B2).
  marker_by_effect_copies:
    1: mthfr_heterozygous
    2: mthfr_c677t_homozygous

