{% extends "base.html" %}

{% block title %}{{ t("login.page_title") }}{% endblock %}

{% block content %}
{% include "partials/login_styles.html" %}
<link rel="stylesheet" href="{{ static_version('/static/server.css') }}">

<div class="bare-pg">
    <div class="bare-in">
        <a href="/app" class="bare-brand">Vitals</a>
        <h1 class="bare-h">{{ t("login.heading") }}</h1>

        <form class="lg" action="/login" method="POST">
            <input type="hidden" name="next" value="{{ next }}">

            <div class="lg-f">
                <label for="lg-username">{{ t("login.username") }}</label>
                <input type="text" id="lg-username" name="username" required
                       autocomplete="username" autocapitalize="none" spellcheck="false"
                       {% if not error %}autofocus{% endif %}>
            </div>

            <div class="lg-f lg-field{% if error %} is-error{% endif %}">
                <label for="lg-password">{{ t("login.password") }}</label>
                <input type="password" id="lg-password" name="password" required
                       autocomplete="current-password" {% if error %}autofocus{% endif %}>
                <button class="lg-eye" type="button" data-lg-reveal
                        aria-controls="lg-password" aria-pressed="false">{{ t("login.reveal") }}</button>
            </div>

            {% if error %}
            <p class="lg-err" role="alert">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error }}</span>
            </p>
            {% endif %}

            <button class="btn w" type="submit" data-lg-submit>
                <span data-lg-submit-label>{{ t("login.submit") }}</span>
            </button>
        </form>
    </div>
</div>

<script>
    (function () {
        var form = document.querySelector('.lg');
        if (!form) return;

        var pw = form.querySelector('#lg-password');
        var reveal = form.querySelector('[data-lg-reveal]');
        var submit = form.querySelector('[data-lg-submit]');
        var label = form.querySelector('[data-lg-submit-label]');
        var strings = {
            reveal: {{ t("login.reveal")|tojson }},
            hide: {{ t("login.hide")|tojson }},
            sending: {{ t("login.submitting")|tojson }}
        };

        if (form.querySelector('.lg-err') && pw) pw.focus();

        if (reveal && pw) {
            reveal.addEventListener('click', function () {
                var shown = pw.type === 'text';
                pw.type = shown ? 'password' : 'text';
                reveal.textContent = shown ? strings.reveal : strings.hide;
                reveal.setAttribute('aria-pressed', String(!shown));
            });
        }

        form.addEventListener('submit', function () {
            if (submit.getAttribute('aria-busy') === 'true') return;
            submit.setAttribute('aria-busy', 'true');
            label.textContent = strings.sending;
        });
    })();
</script>
{% endblock %}
