{% extends "share/_notice.html" %}
{% block title %}{{ t("doc.pw_title") }}{% endblock %}
{% block body %}
<div class="bare-brand">Vitals</div>
<span class="bare-ic">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
    <path d="M7 11V7a5 5 0 0110 0v4"></path>
  </svg>
</span>
<h1 class="bare-h">{{ t("doc.pw_title") }}</h1>
<p class="bare-p">{{ t("doc.pw_hint") }}</p>

<form class="lg" method="POST" action="{{ request.url.path }}">
  <div class="lg-f{% if error %} is-error{% endif %}">
    <label for="report-password">{{ t("doc.pw_label") }}</label>
    <input id="report-password" type="password" name="password" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
  </div>
  {% if error %}
  <p class="lg-err" role="alert">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    <span>{{ t("doc.pw_error") }}</span>
  </p>
  {% endif %}
  <button class="btn w" type="submit">{{ t("doc.pw_submit") }}</button>
</form>
{% endblock %}
