<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title id="offline-title">Vitals — Offline</title>
    <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">
    <link rel="stylesheet" href="/static/server.css">
    <style>
        /* Fallback offline styles if server.css is unavailable */
        body { margin: 0; background: #0C0E12; color: #F4F0F6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .bare-pg { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .bare-in { width: 100%; max-width: 400px; display: grid; justify-items: start; }
        .bare-brand { font-weight: 700; font-size: 22px; color: #F4F0F6; text-decoration: none; }
        .bare-ic { margin-top: 44px; color: #A39AB0; display: flex; }
        .bare-ic svg { width: 36px; height: 36px; }
        .bare-h { margin: 14px 0 0; font-weight: 700; font-size: 34px; line-height: 1.05; color: #F4F0F6; }
        .bare-p { margin: 12px 0 0; color: #CEC6D7; font-size: 15px; line-height: 1.5; }
        .bare-acts { margin-top: 28px; width: 100%; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 22px; border-radius: 14px; background: #F5A623; color: #2A1B03; font-weight: 600; font-size: 15px; border: none; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
    <div class="bare-pg">
        <div class="bare-in">
            <a href="/app" class="bare-brand">Vitals</a>
            <span class="bare-ic">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                    <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
            </span>
            <h1 class="bare-h" id="offline-h1">No connection</h1>
            <p class="bare-p" id="offline-p">Check your internet connection and try again. Vitals needs a connection to load your data.</p>
            <div class="bare-acts">
                <button class="btn" id="offline-btn" onclick="location.reload()">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span>Reload</span>
                </button>
            </div>
        </div>
    </div>
    <script>
        if ((navigator.language || '').toLowerCase().startsWith('ru')) {
            document.documentElement.lang = 'ru';
            document.title = 'Офлайн — Vitals';
            document.getElementById('offline-title').textContent = 'Офлайн — Vitals';
            document.getElementById('offline-h1').textContent = 'Нет подключения';
            document.getElementById('offline-p').textContent = 'Проверь подключение к интернету и попробуй ещё раз. Vitals нужна сеть, чтобы загрузить данные.';
            var btn = document.getElementById('offline-btn');
            if (btn) {
                var span = btn.querySelector('span');
                if (span) span.textContent = 'Обновить';
            }
        }
    </script>
</body>
</html>
