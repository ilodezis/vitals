# Copy this file to secrets.yaml (git-ignored) and replace every placeholder.
# Never commit the real file and never paste its values into docs or chat logs.

# Password of the fallback access point the board opens when it cannot join
# Wi-Fi. WPA2 needs 8 to 63 characters.
ap_password: "change-me-ap-password"

# Password required to upload firmware over Wi-Fi.
ota_password: "change-me-ota-password"

# Key of the encrypted native API (used only by `esphome logs` over Wi-Fi).
# Must be 32 random bytes in base64. Generate one with:
#   python -c "import secrets, base64; print(base64.b64encode(secrets.token_bytes(32)).decode())"
api_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
